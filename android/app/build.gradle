// android/app/build.gradle

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services' // Add Google Services plugin
apply plugin: 'com.google.firebase.crashlytics'
/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.gateguideapp"
    defaultConfig {
        applicationId "com.gateguideapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // FIX: Let the Firebase BOM manage all Firebase dependency versions for you
    // This ensures they are all compatible with each other.
    implementation platform('com.google.firebase:firebase-bom:33.1.2') // Updated to a more recent BOM version
    implementation 'com.google.firebase:firebase-analytics' // Remove the old hardcoded version
    implementation 'com.google.firebase:firebase-messaging'

    implementation project(':react-native-push-notification')
    // ADD CRASHLYTICS and ANALYTICS SDKs
    // The Firebase BOM automatically handles version compatibility
    // implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-crashlytics'
    // implementation 'com.google.firebase:firebase-analytics' // Recommended for breadcrumb logs
}

project.ext.react = [
    // Add these lines:
    disableReanimated: true,
    disableWorklets: true
]

// FIX: Add this entire block at the end of the file.
// This resolves the AndroidX vs Support Library conflict ("Duplicate class...").
configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'com.android.support' && !details.requested.name.contains('multidex')) {
                details.useVersion '1.0.0'
                details.useTarget group: "androidx.legacy", name: "legacy-support-v4", version: '1.0.0'
            }
        }
    }
}